<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Repost Remover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 420px;
  }
  h1 { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .sub { font-size: 0.85rem; color: #555; margin-bottom: 28px; }
  label {
    display: block;
    font-size: 0.75rem;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 1rem;
    padding: 12px 14px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #fe2c55; }
  button {
    width: 100%;
    background: #fe2c55;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .log {
    margin-top: 20px;
    background: #0a0a0a;
    border: 1px solid #1e1e1e;
    border-radius: 10px;
    padding: 14px;
    font-size: 0.8rem;
    font-family: monospace;
    color: #888;
    max-height: 280px;
    overflow-y: auto;
    display: none;
  }
  .entry { padding: 4px 0; border-bottom: 1px solid #141414; }
  .entry:last-child { border-bottom: none; }
  .done { color: #4caf50; font-weight: 700; }
  .error { color: #fe2c55; font-weight: 700; }
  .note {
    font-size: 0.75rem;
    color: #444;
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="card">
  <h1>TikTok Repost Remover</h1>
  <p class="sub">Automatically removes all reposts from your profile.</p>

  <label for="username">TikTok Username</label>
  <input type="text" id="username" placeholder="yourhandle" autocomplete="username">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button id="btn" onclick="startRemoval()">Remove All Reposts</button>

  <div class="log" id="log"></div>

  <p class="note">Your credentials are used only to log in and are never stored.</p>
</div>

<script>
function startRemoval() {
  const username = document.getElementById("username").value.replace("@","").trim();
  const password = document.getElementById("password").value.trim();
  const btn = document.getElementById("btn");
  const log = document.getElementById("log");

  if (!username || !password) { alert("Fill in both fields."); return; }

  btn.disabled = true;
  btn.textContent = "Running...";
  log.style.display = "block";
  log.innerHTML = "";

  const fd = new FormData();
  fd.append("username", username);
  fd.append("password", password);

  fetch("/run", { method: "POST", body: fd }).then(res => {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    function read() {
      reader.read().then(({ done, value }) => {
        if (done) {
          btn.disabled = false;
          btn.textContent = "Remove All Reposts";
          return;
        }
        decoder.decode(value).split("\n").filter(l => l.startsWith("data: ")).forEach(line => {
          const msg = line.replace("data: ", "").trim();
          const el = document.createElement("div");
          el.className = "entry" + (msg.startsWith("DONE") ? " done" : msg.startsWith("ERROR") ? " error" : "");
          el.textContent = msg;
          log.appendChild(el);
          log.scrollTop = log.scrollHeight;
        });
        read();
      });
    }
    read();
  });
}
</script>
</body>
</html>
