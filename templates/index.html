<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Repost Remover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #fff;
  }
  p.sub {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 1rem;
    padding: 12px 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #fe2c55; }
  button {
    width: 100%;
    background: #fe2c55;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .log {
    margin-top: 24px;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 14px;
    font-size: 0.82rem;
    font-family: monospace;
    color: #aaa;
    max-height: 280px;
    overflow-y: auto;
    display: none;
  }
  .log .entry { padding: 3px 0; border-bottom: 1px solid #1a1a1a; }
  .log .entry:last-child { border-bottom: none; }
  .log .done { color: #4caf50; font-weight: 600; }
  .log .error { color: #fe2c55; font-weight: 600; }
  .warning {
    font-size: 0.78rem;
    color: #555;
    margin-top: 16px;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <h1>TikTok Repost Remover</h1>
  <p class="sub">Removes all reposts from your profile automatically.</p>

  <label for="username">TikTok Username</label>
  <input type="text" id="username" placeholder="@yourhandle" autocomplete="username">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button id="btn" onclick="startRemoval()">Remove All Reposts</button>

  <div class="log" id="log"></div>

  <p class="warning">Your credentials are only used to log in and are never stored.</p>
</div>

<script>
function startRemoval() {
  const username = document.getElementById("username").value.replace("@", "").trim();
  const password = document.getElementById("password").value.trim();
  const btn = document.getElementById("btn");
  const log = document.getElementById("log");

  if (!username || !password) {
    alert("Enter your username and password.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Running...";
  log.style.display = "block";
  log.innerHTML = "";

  const formData = new FormData();
  formData.append("username", username);
  formData.append("password", password);

  fetch("/run", { method: "POST", body: formData })
    .then(res => {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      function read() {
        reader.read().then(({ done, value }) => {
          if (done) {
            btn.disabled = false;
            btn.textContent = "Remove All Reposts";
            return;
          }
          const text = decoder.decode(value);
          const lines = text.split("\n").filter(l => l.startsWith("data: "));
          lines.forEach(line => {
            const msg = line.replace("data: ", "").trim();
            const entry = document.createElement("div");
            entry.className = "entry";
            if (msg.startsWith("DONE")) entry.classList.add("done");
            if (msg.startsWith("ERROR")) entry.classList.add("error");
            entry.textContent = msg;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
          });
          read();
        });
      }
      read();
    });
}
</script>
</body>
</html>
